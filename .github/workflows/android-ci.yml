name: Android CI

on:
  push:
    branches:
      - master
      - develop
      - ci-prep
  pull_request:
    branches:
      - master
      - develop

jobs:
  lint:
    name: Ktlint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set execute permissions for Gradle
        run: chmod +x gradlew

      - name : Run ktlintCheck
        run: ./gradlew ktlintCheck

  build:
    name: Gradle build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set execute permissions for Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

  unit-tests :
    name: Run unit tests
    needs : build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set execute permissions for Gradle
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '**/build/test-results/**/*.xml'
